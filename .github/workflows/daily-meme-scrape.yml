name: Daily Meme Scrape

on:
  # schedule:
  #   - cron: "15 04 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KNOWN_MEME_IDS: ${{ vars.KNOWN_MEME_IDS }}
        run: |
          test -n "$WEBSITE_URL" || { echo "Missing WEBSITE_URL (secret)."; exit 1; }
          test -n "$DISCORD_WEBHOOK_URL" || { echo "Missing DISCORD_WEBHOOK_URL (secret)."; exit 1; }
          test -n "$KNOWN_MEME_IDS" || { echo "Missing KNOWN_MEME_IDS (variable)."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper pipeline
        id: pipeline
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KNOWN_MEME_IDS: ${{ vars.KNOWN_MEME_IDS }}
          LOG_LEVEL: INFO
        run: python main.py

      - name: Save latest 5 meme IDs to repo variable
        if: ${{ success() && steps.pipeline.outputs.checkpoint_meme_ids != '' }}
        uses: actions/github-script@v7
        env:
          CHECKPOINT_MEME_IDS: ${{ steps.pipeline.outputs.checkpoint_meme_ids }}
        with:
          script: |
            const name = "KNOWN_MEME_IDS";
            const value = process.env.CHECKPOINT_MEME_IDS;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            await github.request("PATCH /repos/{owner}/{repo}/actions/variables/{name}", {
              owner,
              repo,
              name,
              value,
            });
            core.info(`Updated ${name}=${value}`);
